services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data:ro
      - canonical_vol:/app/data/canonical
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles: ["minimal", "standard", "full"]

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_URL: http://api:8000
      RAG_PIPELINE_VERSION: ${RAG_PIPELINE_VERSION:-v2}
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["minimal", "standard", "full"]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      RAG_PIPELINE_VERSION: ${RAG_PIPELINE_VERSION:-v2}
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["full"]

  qdrant:
    image: qdrant/qdrant:v1.13
    ports:
      - "6333:6333"
    volumes:
      - qdrant_vol:/qdrant/storage
    restart: unless-stopped
    profiles: ["minimal", "standard", "full"]

  ollama:
    image: ollama/ollama:0.5
    ports:
      - "11434:11434"
    volumes:
      - ollama_vol:/root/.ollama
    restart: unless-stopped
    profiles: ["minimal", "standard", "full"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autosar
      POSTGRES_PASSWORD: autosar
      POSTGRES_DB: autosar
    volumes:
      - pg_vol:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: ["standard", "full"]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - os_vol:/usr/share/opensearch/data
    restart: unless-stopped
    profiles: ["standard", "full"]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/autosar
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_vol:/data
    restart: unless-stopped
    profiles: ["full"]

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles: ["full"]

volumes:
  qdrant_vol:
  pg_vol:
  os_vol:
  neo4j_vol:
  canonical_vol:
  ollama_vol:

networks:
  default:
    name: autosar-net
