name: Bug report
description: Report a reproducible AsrBrain defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AsrBrain. Please search existing issues first. Do not attach licensed AUTOSAR specification PDFs/text, OEM/customer data, confidential project files, credentials, or API keys.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What is wrong? Include the visible symptom and impact.
      placeholder: A short, specific description.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or startup
        - Document ingestion or parsing
        - Retrieval or search
        - Answer generation or citations
        - Release, platform, or module detection
        - Streamlit or web UI
        - API or streaming
        - Evaluation or benchmark
        - Docker or deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable set of steps. Use sanitized or synthetic examples.
      placeholder: |
        1. Start the app with ...
        2. Ask ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Paste a sanitized error, relevant logs, or a citation/source mismatch. Redact secrets and confidential data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, install method, model/provider (omit keys), and relevant release/platform/corpus metadata.
      placeholder: Windows 11, Python 3.11, Streamlit, local model...
    validations:
      required: true
