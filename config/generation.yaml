# User-editable generation token caps.
# The Streamlit sidebar "Response length" picker maps to these three presets.
# Change the numbers, save, and rerun — no code edits needed.
# Environment variables (LLM_NUM_PREDICT, LLM_NUM_CTX) override these values.
#
# Sized 2026-10-22 from 6 measured answers (ministral-3:14b, uncapped headroom):
# finished definitions ran 550-1080 tokens, configurations 1300-1600 (longer ones
# still cut at the 2000-token probe). Concise stays the quick-look base tier; the
# answer carries a cap notice instead of cutting silently when a tier is too small.
response_presets:
  concise: 400    # base: quick look, ~1-2 min on CPU
  standard: 1200  # default: definitions + short procedures
  detailed: 2000  # long configuration procedures; keep prompt+output < num_ctx

# Context window passed to local Ollama (num_ctx). Lower it if you hit memory limits.
num_ctx: 8192

# Retrieval breadth per answer (overrides TOPK/FINAL_EVIDENCE when set).
evidence_depths:
  eco: 4
  balanced: 8
  deep: 12
